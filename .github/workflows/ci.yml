name: Go CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Go (lee la versión de go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Descargar dependencias
        run: go mod download

      - name: Verificar compilación
        run: go build -v ./...

      - name: Ejecutar tests con detector de concurrencia
        run: go test -race -v ./...

      - name: Escaneo oficial de vulnerabilidades
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
